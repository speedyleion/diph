name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - uses: r7kamura/rust-problem-matchers@v1
    - name: Run tests
      run: cargo test --workspace --locked

  rust-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - uses: r7kamura/rust-problem-matchers@v1
    - name: Run Format
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Fails when a dependency's license is not accepted in about.toml or
  # cannot be identified, which would otherwise break the release.
  licenses:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-about
    - name: Generate third-party licenses
      run: >-
        cargo about generate --locked --fail -m crates/diph/Cargo.toml
        -o THIRD_PARTY_LICENSES.md about.hbs

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xt0rted/markdownlint-problem-matcher@v3
      - uses: DavidAnson/markdownlint-cli2-action@v25
