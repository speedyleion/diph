name: release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: linux-amd64
            os: ubuntu-latest
          - target: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        run: cargo build --release --locked -p diph
      - name: Third-party licenses
        run: >-
          cargo about generate --locked --fail -m crates/diph/Cargo.toml
          -o target/release/THIRD_PARTY_LICENSES.md about.hbs
      # Archives keep the binary's own name and, on Unix, its executable bit.
      - name: Package
        shell: bash
        run: |
          name="diph-$TAG-${{ matrix.target }}"
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" diph.exe THIRD_PARTY_LICENSES.md
            echo "ASSET=target/release/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" diph THIRD_PARTY_LICENSES.md
            echo "ASSET=target/release/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
