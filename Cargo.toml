[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.98"
license = "BSL-1.0"
repository = "https://github.com/speedyleion/diph"

[workspace.dependencies]
anyhow = "1"
clap = "4"
diph-core = { path = "crates/diph-core" }
eframe = "0.37"
insta = "1"
itertools = "0.15"
muda = { version = "0.21", default-features = false }
serde = "1"
serde_json = "1"
similar = "3"
syntect = "5"
tempfile = "3"
two-face = "0.5"
winit = "0.30"
yare = "3"
egui_kittest = "0.37"

# Smaller release binaries. Not opt-level = 'z': egui lays out the whole
# UI on every frame it draws, so speed matters more than the last few MB.
[profile.release]
lto = true
codegen-units = 1
strip = true
